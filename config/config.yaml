# Table of Synapse files to download.
# Columns: syn_id, category (data | metadata | DE), filename, description
synapse_files: config/synapse_files.tsv

# Brain region -> study it comes from
# (region = value of the 'tissue' column in the covariates file)
regions:
  DLPFC: ROSMAP
  ACC: ROSMAP
  PCC: ROSMAP
  TCX: Mayo
  CBE: Mayo

# Diagnosis groups to keep (values of the 'diagnosis' column)
diagnoses: [AD, CT]

# Subsampling designs (see docs/experimental_design.md)
subsampling:
  # Replicates (random draws) per design. Each network is already stabilized by
  # ARACNe-AP (bootstraps + consolidation), so few replicates are enough to
  # capture which donors were drawn. The curve only needs the mean J per n.
  replicates:
    matched: 10
    equal_n: 10
    curve: 5
    paired: 10
  seed: 2026

  # 2. Same n in every network, to test if the region ranking depends on n
  equal_n:
    n: 90
    regions: [DLPFC, ACC, PCC]

  # 3. Reproducibility curve: two disjoint subsamples of size n from one group
  curve:
    - {region: DLPFC, dx: AD, n: [60, 100, 140]} # calibration
    - {region: DLPFC, dx: CT, n: [70]} # validation
    - {region: ACC, dx: AD, n: [85]} # validation
    - {region: PCC, dx: AD, n: [75]} # validation

  # Paired design: only donors sampled in both regions.
  # Not part of the current design (not in docs/experimental_design.md).
  # (ARACNe rules do not support paired tables yet). To enable, use:
  #   paired: [[DLPFC, PCC], [DLPFC, ACC]]
  paired: []

# Folder with the networks to compare: networks in <network_source>/aracne/,
# results in <network_source>/metrics/.
#   results                      ARACNe-AP networks (the real ones)
#   results/simulated/planted    simulated, with planted rewiring (workflow/scripts/simulate_networks.R)
#   results/simulated/null       simulated, AD = CT
# To test with simulated networks without editing this file:
#   snakemake network_comparisons --config network_source=results/simulated/planted --sdm conda --cores 4
network_source: results

# Communities for the NMI: Leiden (modularity objective), undirected and unweighted
communities:
  resolution: 1
  seed: 2026 # Leiden is stochastic: fixed seed, same partition every run

# Networks vs differential expression (docs/experimental_design.md, analyses 4 and 5)
de:
  adj_pvalue: 0.05 # DE gene: adj.P.Val < 0.05 ...
  fold_change: 1.2 # ... and |FC| > 1.2, i.e. |logFC| > log2(1.2). Same as Sage's DEA
  min_degree: 5 # Analysis 4: genes with >= 5 neighbors in the AD or the CT network
  top_rewired: 0.10 # Analysis 4: "rewired" genes = top 10% by adjusted rewiring
  top_de: 25 # Analysis 4, ego networks: top 25 DE up and top 25 DE down by |t|

# Hubs (analysis 5)
hubs:
  top_pagerank: 0.01 # hub of a network = top 1% by PageRank (undirected, unweighted)
  min_replicates: 8 # AD hub (and gained ego neighbor) = in >= 8 of the 10 AD replicates

# ARACNe-AP (https://github.com/califano-lab/ARACNe-AP)
# Rule install_aracne downloads this commit and builds the jar with `ant main`
aracne:
  commit: 30967ea10494fcb42c2bfd00604c94907da5397b # last commit (2018-04-12)
  jar: resources/aracne/aracne.jar
  pvalue: "1E-8" # p-value of the MI threshold (step 1 and bootstraps)
  bootstrap:
    n_boot: 100 # bootstraps per network
    threads: 4 # threads of each bootstrap job
  memory: # GB per job
    threshold_gb: 8
    bootstrap_gb: 16
    consolidate_gb: 8
